<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>往日 · 世界怪兽日报</title>

<style>
  :root {
    --ink: #121212;
    --muted: #5c5c5c;
    --rule: #c8c4ba;
    --paper: #f7f5f0;
    --paper-deep: #efece4;
    --accent: #1a1a1a;
    --max: 420px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: #e8e4db;
    color: var(--ink);
    font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 16px;
    line-height: 1.55;
    min-height: 100vh;
  }
  .sheet {
    max-width: var(--max);
    margin: 0 auto;
    background: var(--paper);
    min-height: 100vh;
    padding: 20px 18px 48px;
    box-shadow: 0 0 40px rgba(0,0,0,.08);
  }
  /* Masthead */
  .masthead {
    text-align: center;
    padding: 8px 0 14px;
    border-bottom: 3px double var(--ink);
    margin-bottom: 18px;
  }
  .masthead .brand {
    font-family: "Times New Roman", Times, "Songti SC", "Noto Serif SC", serif;
    font-size: 1.85rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    line-height: 1.15;
  }
  .masthead .brand-en {
    font-family: "Times New Roman", Times, serif;
    font-size: 0.68rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 4px;
  }
  .masthead .meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
    padding-top: 8px;
    border-top: 1px solid var(--rule);
    font-size: 0.68rem;
    letter-spacing: 0.06em;
    color: var(--muted);
    text-transform: uppercase;
  }
  /* Lead */
  .lead {
    margin-bottom: 22px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--rule);
  }
  .lead .kicker {
    font-size: 0.68rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
    font-weight: 600;
  }
  .lead h1 {
    font-family: "Times New Roman", Times, "Songti SC", "Noto Serif SC", serif;
    font-size: 1.72rem;
    font-weight: 700;
    line-height: 1.22;
    letter-spacing: -0.01em;
    margin-bottom: 12px;
  }
  .lead figure {
    margin: 0 0 10px;
  }
  .lead img {
    width: 100%;
    height: auto;
    aspect-ratio: 3 / 2;
    object-fit: cover;
    display: block;
    background: var(--paper-deep);
  }
  .lead .caption {
    font-size: 0.72rem;
    color: var(--muted);
    margin-top: 6px;
    line-height: 1.4;
  }
  .lead .dek {
    font-size: 0.98rem;
    color: #2a2a2a;
    margin-bottom: 10px;
  }
  .byline {
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.02em;
  }
  /* Sections */
  .section {
    margin-bottom: 8px;
    padding-top: 6px;
  }
  .section-head {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    border-bottom: 1px solid var(--ink);
    padding-bottom: 6px;
    margin: 18px 0 14px;
  }
  article.story {
    margin-bottom: 18px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--rule);
  }
  article.story:last-child { border-bottom: none; }
  .story.featured figure {
    margin: 0 0 10px;
  }
  .story img {
    width: 100%;
    height: auto;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    display: block;
    background: var(--paper-deep);
  }
  .story h2 {
    font-family: "Times New Roman", Times, "Songti SC", "Noto Serif SC", serif;
    font-size: 1.18rem;
    font-weight: 700;
    line-height: 1.28;
    margin-bottom: 8px;
  }
  .story.compact h2 { font-size: 1.05rem; }
  .story p {
    font-size: 0.92rem;
    color: #222;
    margin-bottom: 8px;
  }
  .story .byline { margin-top: 2px; }
  /* Two-up compact row */
  .pair {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 14px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--rule);
  }
  .pair article {
    border-bottom: none;
    margin: 0;
    padding: 0;
  }
  .pair h2 {
    font-size: 0.95rem;
    margin-top: 8px;
  }
  .pair p { font-size: 0.82rem; }
  .pair img { aspect-ratio: 1 / 1; }
  /* Thumb + text */
  .row {
    display: grid;
    grid-template-columns: 112px 1fr;
    gap: 12px;
    align-items: start;
    margin-bottom: 16px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--rule);
  }
  .row img {
    width: 112px;
    height: 112px;
    object-fit: cover;
    aspect-ratio: 1 / 1;
  }
  .row h2 { font-size: 0.98rem; margin-bottom: 6px; }
  .row p { font-size: 0.84rem; margin-bottom: 4px; }
  /* Footer */
  .footer {
    margin-top: 28px;
    padding-top: 14px;
    border-top: 3px double var(--ink);
    text-align: center;
    font-size: 0.68rem;
    color: var(--muted);
    letter-spacing: 0.08em;
    line-height: 1.7;
  }
  .toc {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 10px;
    justify-content: center;
    margin: 10px 0 4px;
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .toc span::after { content: "·"; margin-left: 10px; color: var(--rule); }
  .toc span:last-child::after { content: ""; }
  @media (min-width: 480px) {
    .sheet { margin: 16px auto; border-radius: 2px; }
  }
  /* ===== RESPONSIVE OVERRIDES (phone + desktop) ===== */
  html, body { max-width: 100%; overflow-x: hidden; }
  img, figure, video { max-width: 100%; }
  img { height: auto; display: block; }
  .sheet { width: 100%; }
  .section > *, .pair > *, .row > *, .lead > * { min-width: 0; }
  .row img { width: 100%; height: auto; max-width: 112px; }
  .story, .row, .pair article { overflow-wrap: anywhere; }
  @media (max-width: 699px) {
    .sheet { max-width: 100%; margin: 0; padding: 18px 16px 40px; }
  }
  @media (min-width: 700px) {
    :root { --max: 1100px; }
    .sheet { max-width: var(--max); margin: 24px auto; padding: 32px 40px 56px; }
    .masthead .brand { font-size: 2.6rem; }
    .lead { display: grid; grid-template-columns: 3fr 2fr; gap: 0 28px; align-items: start; }
    .lead figure { grid-column: 1; grid-row: 1 / span 4; margin: 0; }
    .lead .kicker, .lead h1, .lead .dek, .lead .byline { grid-column: 2; }
    .lead h1 { font-size: 2.1rem; }
    .section { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 28px; align-items: start; }
    .section > .section-head { grid-column: 1 / -1; }
    .pair { display: contents; }
    .pair article { margin-bottom: 18px; padding-bottom: 16px; border-bottom: 1px solid var(--rule); }
    .pair article img { aspect-ratio: 16 / 9; }
    .pair h2 { font-size: 1.05rem; }
    article.story:last-child { border-bottom: 1px solid var(--rule); }
    .row { margin-bottom: 18px; }
  }
  @media (min-width: 1024px) {
    .section { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  /* Site name: 世界怪兽日报 */
  /* ===== THEME: GOOGLE (Material 3 / Google News) ===== */
  :root { --bg:#f8f9fa; --surface:#fff; --ink:#202124; --body:#3c4043; --muted:#5f6368; --rule:#e8eaed;

  @media (prefers-color-scheme: dark) {
    :root { --bg:#131314; --surface:#1e1f20; --ink:#e3e3e3; --body:#c4c7c5; --muted:#9aa0a6; --rule:#303134;

  }
  html { background:var(--bg); }
  body { background:var(--bg); color:var(--body); font-size:17px; line-height:1.7;
    font-family:"Google Sans",Roboto,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif; }
  .sheet { background:transparent; box-shadow:none; }
  .masthead { text-align:left; border:none; padding:8px 4px 4px; margin-bottom:18px; }
  .masthead .brand { font-family:inherit; font-size:1.9rem; font-weight:700; letter-spacing:0; color:var(--ink); }
  .masthead .brand-en { font-family:inherit; font-size:.8rem; letter-spacing:.08em; color:var(--muted); text-transform:none; }
  .masthead .meta { border:none; justify-content:flex-start; gap:12px; font-size:.9rem; color:var(--muted); text-transform:none; letter-spacing:0; padding-top:4px; margin-top:4px; }
  .toc { flex-wrap:nowrap; overflow-x:auto; justify-content:flex-start; gap:8px; margin:14px 0 4px; padding-bottom:6px;

  .story h2, .row h2, .pair h2 { font-family:inherit; font-weight:700; color:var(--ink); line-height:1.35; }
  .story h2 { font-size:1.25rem; } .row h2, .pair h2 { font-size:1.12rem; }
  .lead .dek, .story p, .row p, .pair p { color:var(--body) !important; font-size:1rem !important; line-height:1.7; }
  .byline { color:var(--muted) !important; font-size:.8rem !important; font-weight:500; }
  .lead img, .story img, .pair img { border-radius:12px; }
  .row img { border-radius:10px; }
  .section-head { display:inline-block; justify-self:start; border:none; background:var(--chip); color:var(--chip-ink);

  .pair { border:none; }
  .footer { border-top:1px solid var(--rule); color:var(--muted); font-size:.85rem; letter-spacing:0; }
  @media (min-width:700px) {
    .section > .section-head { grid-column:1 / -1; }

  }
  /* Today / Past nav + clickable brand */
  a { color:inherit; text-decoration:none; }
  a:hover { color:var(--accent); }
  .brand a { color:var(--ink); }
  .brand a:hover { color:var(--accent); }
  .day-nav { display:flex; gap:8px; margin:0 0 14px; }
  .day-nav a { padding:8px 18px; border-radius:999px; font-size:.95rem; font-weight:600; border:1px solid var(--rule); background:var(--surface); color:var(--muted); }
  .day-nav a.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .day-nav a:hover:not(.active) { border-color:var(--accent); color:var(--accent); }
  .toc a { flex:0 0 auto; padding:6px 16px; border:1px solid var(--rule); border-radius:8px; background:var(--surface); color:var(--ink); font-weight:500; }
  .toc a:hover { border-color:var(--accent); color:var(--accent); }
  .archive-list { list-style:none; margin:0; padding:0; }
  .archive-list li { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); margin:0 0 12px; }
  .archive-list a { display:flex; flex-wrap:wrap; gap:6px 16px; align-items:baseline; padding:18px 20px; }

  .page-title { font-size:1.5rem; font-weight:700; color:var(--ink); margin:8px 0 18px; }
</style>
