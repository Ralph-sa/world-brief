<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>往日 · 世界怪兽日报</title>
<meta property="og:title" content="往日 · 世界怪兽日报" />
<meta name="twitter:title" content="往日 · 世界怪兽日报" />
<style>
  :root {
    --ink: #121212;
    --muted: #5c5c5c;
    --rule: #c8c4ba;
    --paper: #f7f5f0;
    --paper-deep: #efece4;
    --accent: #1a1a1a;
    --max: 420px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: #e8e4db;
    color: var(--ink);
    font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 16px;
    line-height: 1.55;
    min-height: 100vh;
  }
  .sheet {
    max-width: var(--max);
    margin: 0 auto;
    background: var(--paper);
    min-height: 100vh;
    padding: 20px 18px 48px;
    box-shadow: 0 0 40px rgba(0,0,0,.08);
  }
  /* Masthead */
  .masthead {
    text-align: center;
    padding: 8px 0 14px;
    border-bottom: 3px double var(--ink);
    margin-bottom: 18px;
  }
  .masthead .brand {
    font-family: "Times New Roman", Times, "Songti SC", "Noto Serif SC", serif;
    font-size: 1.85rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    line-height: 1.15;
  }
  .masthead .brand-en {
    font-family: "Times New Roman", Times, serif;
    font-size: 0.68rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 4px;
  }
  .masthead .meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
    padding-top: 8px;
    border-top: 1px solid var(--rule);
    font-size: 0.68rem;
    letter-spacing: 0.06em;
    color: var(--muted);
    text-transform: uppercase;
  }
  /* Lead */
  .lead {
    margin-bottom: 22px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--rule);
  }
  .lead .kicker {
    font-size: 0.68rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
    font-weight: 600;
  }
  .lead h1 {
    font-family: "Times New Roman", Times, "Songti SC", "Noto Serif SC", serif;
    font-size: 1.72rem;
    font-weight: 700;
    line-height: 1.22;
    letter-spacing: -0.01em;
    margin-bottom: 12px;
  }
  .lead figure {
    margin: 0 0 10px;
  }
  .lead img {
    width: 100%;
    height: auto;
    aspect-ratio: 3 / 2;
    object-fit: cover;
    display: block;
    background: var(--paper-deep);
  }
  .lead .caption {
    font-size: 0.72rem;
    color: var(--muted);
    margin-top: 6px;
    line-height: 1.4;
  }
  .lead .dek {
    font-size: 0.98rem;
    color: #2a2a2a;
    margin-bottom: 10px;
  }
  .byline {
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.02em;
  }
  /* Sections */
  .section {
    margin-bottom: 8px;
    padding-top: 6px;
  }
  .section-head {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    border-bottom: 1px solid var(--ink);
    padding-bottom: 6px;
    margin: 18px 0 14px;
  }
  article.story {
    margin-bottom: 18px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--rule);
  }
  article.story:last-child { border-bottom: none; }
  .story.featured figure {
    margin: 0 0 10px;
  }
  .story img {
    width: 100%;
    height: auto;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    display: block;
    background: var(--paper-deep);
  }
  .story h2 {
    font-family: "Times New Roman", Times, "Songti SC", "Noto Serif SC", serif;
    font-size: 1.18rem;
    font-weight: 700;
    line-height: 1.28;
    margin-bottom: 8px;
  }
  .story.compact h2 { font-size: 1.05rem; }
  .story p {
    font-size: 0.92rem;
    color: #222;
    margin-bottom: 8px;
  }
  .story .byline { margin-top: 2px; }
  /* Two-up compact row */
  .pair {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 14px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--rule);
  }
  .pair article {
    border-bottom: none;
    margin: 0;
    padding: 0;
  }
  .pair h2 {
    font-size: 0.95rem;
    margin-top: 8px;
  }
  .pair p { font-size: 0.82rem; }
  .pair img { aspect-ratio: 1 / 1; }
  /* Thumb + text */
  .row {
    display: grid;
    grid-template-columns: 112px 1fr;
    gap: 12px;
    align-items: start;
    margin-bottom: 16px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--rule);
  }
  .row img {
    width: 112px;
    height: 112px;
    object-fit: cover;
    aspect-ratio: 1 / 1;
  }
  .row h2 { font-size: 0.98rem; margin-bottom: 6px; }
  .row p { font-size: 0.84rem; margin-bottom: 4px; }
  /* Footer */
  .footer {
    margin-top: 28px;
    padding-top: 14px;
    border-top: 3px double var(--ink);
    text-align: center;
    font-size: 0.68rem;
    color: var(--muted);
    letter-spacing: 0.08em;
    line-height: 1.7;
  }
  .toc {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 10px;
    justify-content: center;
    margin: 10px 0 4px;
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .toc span::after { content: "·"; margin-left: 10px; color: var(--rule); }
  .toc span:last-child::after { content: ""; }
  @media (min-width: 480px) {
    .sheet { margin: 16px auto; border-radius: 2px; }
  }
  /* ===== RESPONSIVE OVERRIDES (phone + desktop) ===== */
  html, body { max-width: 100%; } /* overflow-x removed: breaks position:sticky/fixed ancestors */
  img, figure, video { max-width: 100%; }
  img { height: auto; display: block; }
  .sheet { width: 100%; }
  .section > *, .pair > *, .row > *, .lead > * { min-width: 0; }
  .row img { width: 100%; height: auto; max-width: 112px; }
  .story, .row, .pair article { overflow-wrap: anywhere; }
  @media (max-width: 699px) {
    .sheet { max-width: 100%; margin: 0; padding: 18px 16px 40px; }
  }
  @media (min-width: 700px) {
    :root { --max: 1100px; }
    .sheet { max-width: var(--max); margin: 24px auto; padding: 32px 40px 56px; }
    .masthead .brand { font-size: 2.6rem; }
    .lead { display: grid; grid-template-columns: 3fr 2fr; gap: 0 28px; align-items: start; }
    .lead figure { grid-column: 1; grid-row: 1 / span 4; margin: 0; }
    .lead .kicker, .lead h1, .lead .dek, .lead .byline { grid-column: 2; }
    .lead h1 { font-size: 2.1rem; }
    .section { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 28px; align-items: start; }
    .section > .section-head { grid-column: 1 / -1; }
    .pair { display: contents; }
    .pair article { margin-bottom: 18px; padding-bottom: 16px; border-bottom: 1px solid var(--rule); }
    .pair article img { aspect-ratio: 16 / 9; }
    .pair h2 { font-size: 1.05rem; }
    article.story:last-child { border-bottom: 1px solid var(--rule); }
    .row { margin-bottom: 18px; }
  }
  @media (min-width: 1024px) {
    .section { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  /* Site name: 世界怪兽日报 */
  /* ===== THEME: PS4 home / cool XMB (世界怪兽日报) ===== */
  :root {
    --bg:#0a1628; --panel:rgba(12,28,52,.82); --ink:#eaf4ff; --body:#c5d6ea; --muted:#7a9bb8;
    --rule:rgba(120,180,255,.18); --accent:#5eb8ff; --accent2:#3d8fd9; --edge:#2a5a8a;
    --chip:rgba(94,184,255,.14); --chip-ink:#9fd4ff;
    --shadow:0 0 0 2px rgba(0,20,40,.8), 0 0 0 4px var(--edge), 0 12px 32px rgba(0,0,0,.45);
  }
  html { background:var(--bg); }
  body {
    background:transparent; color:var(--body); font-size:17px; line-height:1.75;
    font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  }
  #xmb { position:fixed; inset:0; width:100%; height:100%; z-index:-2; display:block; pointer-events:none; }
  .sheet { background:transparent; box-shadow:none; }
  a { color:inherit; text-decoration:none; }
  a:hover { color:var(--accent); }

  /* Minimal non-fixed day switcher (not a title bar) */
  .day-switch {
    display:flex; gap:8px; margin:0 0 18px; flex-wrap:wrap;
  }
  .day-switch a {
    padding:6px 14px; font-size:.85rem; font-weight:600; letter-spacing:.04em;
    border:1px solid var(--edge); border-radius:999px; background:rgba(8,20,40,.55);
    color:var(--muted);
  }
  .day-switch a.active { background:var(--accent); color:#061018; border-color:var(--accent); }
  .day-switch a:hover:not(.active) { color:var(--accent); border-color:var(--accent); }

  .page-brand {
    font-size:1.75rem; font-weight:800; letter-spacing:.06em; color:var(--ink);
    margin:0 0 6px; text-shadow:0 0 24px rgba(94,184,255,.35);
  }
  .page-brand a { color:var(--ink); }
  .page-brand a:hover { color:var(--accent); }
  .page-meta {
    display:flex; gap:12px; flex-wrap:wrap; font-size:.9rem; color:var(--muted);
    margin:0 0 20px; padding-bottom:14px; border-bottom:1px solid var(--rule);
  }

  /* Inline section chips (content, not fixed) */
  .toc {
    display:flex; flex-wrap:nowrap; overflow-x:auto; gap:8px; margin:0 0 20px; padding-bottom:6px;
    scrollbar-width:none; justify-content:flex-start;
  }
  .toc::-webkit-scrollbar { display:none; }
  .toc a, .toc span {
    flex:0 0 auto; padding:6px 14px; border:1px solid var(--edge); border-radius:999px;
    background:rgba(8,20,40,.45); color:var(--ink); font-weight:600; font-size:.88rem;
  }
  .toc a:hover { border-color:var(--accent); color:var(--accent); }
  .toc span::after { content:"" !important; margin:0; }

  .lead, article.story, .row, .pair article {
    background:var(--panel); border:none !important; border-radius:14px; box-shadow:var(--shadow);
    padding:18px !important; margin:0 0 16px !important; overflow:hidden;
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  }
  .lead .kicker { color:var(--accent); font-size:.85rem; letter-spacing:.08em; text-transform:none; font-weight:700; }
  .lead .kicker::before { content:"▶ "; }
  .lead h1, .story h2, .row h2, .pair h2 {
    font-family:inherit; font-weight:800; color:var(--ink); line-height:1.35;
  }
  .lead h1 { font-size:1.65rem; }
  .story h2 { font-size:1.25rem; } .row h2, .pair h2 { font-size:1.12rem; }
  .lead .dek, .story p, .row p, .pair p { color:var(--body) !important; font-size:1rem !important; line-height:1.75; }
  .byline { color:var(--accent) !important; font-size:.8rem !important; font-weight:600; }
  .lead img, .story img, .pair img, .row img { border-radius:10px; filter:saturate(.95) brightness(.98); }

  .section-head {
    display:inline-block; justify-self:start; border:none; background:var(--chip); color:var(--chip-ink);
    font-size:1rem; font-weight:700; letter-spacing:0; text-transform:none;
    padding:6px 16px; border-radius:999px; margin:22px 0 14px;
  }
  .pair { border:none; }
  .footer {
    border-top:1px solid var(--rule); color:var(--muted); font-size:.85rem;
    padding:14px 0; margin-top:24px; text-align:center;
  }
  .page-title { font-size:1.45rem; font-weight:800; color:var(--ink); margin:0 0 16px; }
  .archive-list { list-style:none; margin:0; padding:0; }
  .archive-list li { background:var(--panel); box-shadow:var(--shadow); margin:0 0 12px; border-radius:14px; }
  .archive-list a { display:flex; flex-wrap:wrap; gap:6px 16px; align-items:baseline; padding:18px 20px; }
  .archive-list .date { font-weight:700; color:var(--accent); font-size:1.05rem; min-width:7.5em; }
  .archive-list .title { color:var(--body); flex:1 1 200px; }
  .archive-list .tag { font-size:.75rem; font-weight:700; color:#061018; background:var(--accent); padding:3px 10px; border-radius:999px; }
  .archive-list a:hover .title { color:var(--accent); }

  @media (min-width:700px) {
    .section > .section-head { grid-column:1 / -1; }
    .section { gap:0 20px; }
    .page-brand { font-size:2.2rem; }
    .lead h1 { font-size:2rem; } .story h2 { font-size:1.35rem; }
    .lead { padding:24px !important; }
  }
  @media (max-width:699px) {
    .page-brand { font-size:1.5rem; }
    .lead h1 { font-size:1.45rem; }
  }
</style>

<script>(function(){
  /* PS4-style cool blue home waves */
  var c=document.getElementById('xmb'); if(!c) return; var x=c.getContext('2d');
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var w,h,dpr=Math.min(window.devicePixelRatio||1,1.25),t=Math.random()*200,last=0;
  function size(){w=c.width=Math.round(innerWidth*dpr);h=c.height=Math.round(innerHeight*dpr);if(reduce)draw();}
  function draw(){
    var g=x.createLinearGradient(0,0,0,h);
    g.addColorStop(0,'#0b1c38'); g.addColorStop(.45,'#0a2848'); g.addColorStop(1,'#061018');
    x.globalCompositeOperation='source-over'; x.fillStyle=g; x.fillRect(0,0,w,h);
    /* soft vignette glow */
    var rg=x.createRadialGradient(w*0.7,h*0.15,0,w*0.55,h*0.4,h*0.9);
    rg.addColorStop(0,'rgba(40,120,200,0.22)'); rg.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=rg; x.fillRect(0,0,w,h);
    x.globalCompositeOperation='lighter';
    for(var k=0;k<6;k++){
      x.beginPath();
      var amp=h*(0.035+0.018*k), base=h*(0.42+0.07*k), ph=t*(0.35+k*0.12)+k*1.1;
      var layers=56;
      for(var i=0;i<=layers;i++){
        var u=i/layers, px=u*w;
        var py=base
          +Math.sin(u*Math.PI*2*(0.9+k*0.08)+ph)*amp
          +Math.sin(u*Math.PI*2*2.1+ph*1.4)*amp*0.28
          +Math.sin(u*9+ph*0.7)*amp*0.08;
        i?x.lineTo(px,py):x.moveTo(px,py);
      }
      x.lineWidth=(k%2?1.2:36)*dpr;
      var a=k%2?0.16:0.045;
      x.strokeStyle='hsla('+(195+k*4)+',85%,'+(62+k*3)+'%,'+a+')';
      x.stroke();
    }
  }
  size(); addEventListener('resize',size);
  if(reduce){ draw(); return; }
  (function loop(now){ requestAnimationFrame(loop); if(document.hidden||now-last<50) return; last=now; t+=0.008; draw(); })(0);
})();
</script>
